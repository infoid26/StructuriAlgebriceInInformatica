name: Build and deploy Node.js app to Azure Web App - infoid26-sa

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: Install dependencies and verify application
        run: |
          npm install
          npm run build --if-present
          npm run check

      - name: Package application
        run: |
          npm prune --omit=dev
          zip -q -r "$RUNNER_TEMP/course-app.zip" index.html package.json site scripts node_modules

      - name: Login to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7F1083C726514BE6AD24E20D3A49E3FE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4078DACDA41F40A79554AC5261BD9942 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D9F564772C5D4012BD3CFA43886E97A1 }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group infoid_group \
            --name infoid26-sa \
            --src-path "$RUNNER_TEMP/course-app.zip" \
            --type zip \
            --restart true \
            --track-status true \
            --output none
